  --font:"Segoe UI Variable Text","Segoe UI","InterEmbed",system-ui,-apple-system,sans-serif;
  --display:"Segoe UI Variable Display","Segoe UI","InterEmbed",system-ui,-apple-system,sans-serif;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14151A; --surface:#1E2028; --surface-2:#252832; --surface-3:#2D313C; --line:#343947; --land:#2F3441;
    --ink:#ECEEF4; --muted:#A4AABA; --faint:#7E8495;
    --blue:#7AA2FF; --violet:#A891FF; --teal:#45CDBB; --pink:#F08AB6; --amber:#F2B451;
    --blue-soft:rgba(122,162,255,.14); --violet-soft:rgba(168,145,255,.14); --teal-soft:rgba(69,205,187,.13); --amber-soft:rgba(242,180,81,.14); --pink-soft:rgba(240,138,182,.13);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -16px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;
  background:radial-gradient(38% 30% at 18% 12%,rgba(47,107,255,.15),transparent 70%),radial-gradient(30% 26% at 88% 8%,rgba(217,87,143,.11),transparent 70%),radial-gradient(36% 32% at 80% 92%,rgba(17,158,145,.12),transparent 70%),radial-gradient(30% 30% at 30% 96%,rgba(122,92,250,.11),transparent 70%);}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3,h4{font-family:var(--display);margin:0;font-weight:600;letter-spacing:-.01em}
.muted{color:var(--muted)} .small{font-size:13.5px}

/* orb */
.orb{position:relative;flex:none;width:32px;height:32px;border-radius:42% 58% 52% 48%/48% 42% 58% 52%;background:conic-gradient(from 210deg,#2F6BFF,#7A5CFA,#D9578F,#FF9D5C,#19B8A6,#2F6BFF)}
.orb::after{content:"";position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.95),rgba(255,255,255,.35) 60%,transparent 70%)}
.orb.lg{width:96px;height:96px} .orb.sm{width:26px;height:26px}

/* gate */
.gate{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(243,244,248,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:opacity .45s ease,visibility .45s}
@media (prefers-color-scheme:dark){.gate{background:rgba(20,21,26,.78)}}
.gate.hidden{opacity:0;visibility:hidden}
.gate-card{text-align:center;max-width:460px;width:100%}
.gate .orb.lg{margin:0 auto 26px;animation:morph 9s ease-in-out infinite}
@keyframes morph{0%,100%{border-radius:42% 58% 52% 48%/48% 42% 58% 52%;transform:rotate(0)}50%{border-radius:56% 44% 40% 60%/42% 58% 44% 56%;transform:rotate(25deg)}}
.gate h1{font-size:clamp(30px,6vw,40px);line-height:1.1}
.gate p{color:var(--muted);margin:10px 0 28px}
.gate-btns{display:grid;gap:12px}
.lang-btn{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);text-align:left;transition:border-color .2s,transform .2s}
.lang-btn:hover{border-color:var(--blue);transform:translateY(-1px)}
.lang-btn b{display:block;font-size:16px;font-weight:600}
.lang-btn small{color:var(--muted);font-size:13px}
.lang-code{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--surface-2);color:var(--blue)}
.gate-foot{margin-top:24px;font-size:12.5px;color:var(--faint)}

/* shell */
.app{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden}
.bar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 60%,transparent);backdrop-filter:blur(10px)}
.bar-title{display:flex;align-items:center;gap:10px;min-width:0}
.bar-title b{font-family:var(--display);font-weight:600;white-space:nowrap}
.badge-g{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--teal-soft);color:var(--teal);font-weight:600;white-space:nowrap}
.spacer{flex:1}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface-3)}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.icon-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600}
.icon-btn:hover{border-color:var(--blue)}
.icon-btn[aria-pressed="true"]{background:var(--violet-soft);border-color:transparent;color:var(--violet)}
.thread{flex:1;min-height:0;overflow-y:auto;position:relative}
.wide{max-width:1160px;margin:0 auto;padding:26px 24px 10px}
.narrow{max-width:820px;margin:0 auto;padding:0 24px 30px}

/* dashboard */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);min-width:0;position:relative}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.tile-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.tile-h h3{font-size:16px;display:flex;align-items:center;gap:8px}
.tile-h h3 svg{color:var(--violet)}
.ask-link{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface-2);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--blue);white-space:nowrap}
.ask-link:hover{background:var(--blue-soft)}

.hero{display:flex;flex-direction:column;gap:14px;overflow:hidden}
.hero-top{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.hero h1{font-size:clamp(38px,5.4vw,60px);line-height:1;letter-spacing:-.03em}
.hero h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .role{font-family:var(--display);font-size:18px;font-weight:500}
.hero .stmt{color:var(--muted);font-size:16px;max-width:52ch;margin:0}
.hero .stmt b{color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.p-blue{background:var(--blue-soft);color:var(--blue)}.p-violet{background:var(--violet-soft);color:var(--violet)}.p-teal{background:var(--teal-soft);color:var(--teal)}.p-amber{background:var(--amber-soft);color:var(--amber)}.p-pink{background:var(--pink-soft);color:var(--pink)}.p-gray{background:var(--surface-2);color:var(--muted)}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:100%}
.kpi{background:var(--surface-2);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:104px}
.kpi b{display:block;margin-bottom:4px;font-family:var(--display);font-size:30px;font-weight:700;line-height:1;letter-spacing:-.02em}
.kpi span{font-size:12.5px;color:var(--muted);line-height:1.35}
.kpi .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}

/* map */
.map-wrap{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.map svg{width:100%;height:auto;display:block}
.map .land{fill:var(--land)}
.map .hl{fill:var(--violet);opacity:.28;transition:opacity .3s}
.map .hl.on{opacity:.75}
.map .arc{fill:none;stroke:var(--violet);stroke-width:1.6;stroke-dasharray:4 4;opacity:.7}
.map .arc-draw{fill:none;stroke:var(--blue);stroke-width:2;stroke-linecap:round}
.map .pin{cursor:pointer}
.map .pin circle.dot{fill:var(--surface);stroke:var(--violet);stroke-width:3;transition:r .2s}
.map .pin.on circle.dot{fill:var(--violet)}
.map .pin circle.halo{fill:var(--violet);opacity:0}
.map .pin.on circle.halo{animation:halo 1.8s ease-out infinite}
@keyframes halo{0%{opacity:.35;r:7}100%{opacity:0;r:22}}
.map .home circle{fill:var(--blue)}
.ctry{display:grid;gap:6px}
.ctry button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;text-align:left;font-size:14px;font-weight:600}
.ctry button .cc{width:30px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.ctry button[aria-pressed="true"]{border-color:var(--violet);background:var(--violet-soft)}
.ctry button[aria-pressed="true"] .cc{background:var(--violet);color:#fff}
.ctry-d{margin-top:8px;padding:12px;border-radius:12px;background:var(--surface-2);font-size:13.5px;min-height:76px}
.ctry-d b{display:block;font-size:14px;margin-bottom:2px}

/* languages */
.langs{display:grid;gap:14px}
.lg-row{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.lg-row b{font-size:14.5px;font-weight:600}
.lg-row span{font-size:12.5px;color:var(--muted)}
.lg-bar{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.lg-bar i{height:8px;border-radius:999px;background:var(--surface-3);position:relative;overflow:hidden}
.lg-bar i.f::after{content:"";position:absolute;inset:0;background:var(--grad);background-size:500% 100%;transform:scaleX(0);transform-origin:left;transition:transform .5s ease}
.played .lg-bar i.f::after{transform:scaleX(1)}
.lang-note{margin-top:14px;font-size:13px;color:var(--muted);display:flex;gap:8px}
.lang-note svg{color:var(--violet);margin-top:1px}

/* timeline */
.tl-lab{font-size:12.5px;color:var(--faint);margin:0 0 6px}
.lane{position:relative;height:48px;margin-bottom:10px}
.seg-t{position:absolute;top:0;height:100%;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);padding:0 10px;display:flex;align-items:center;overflow:hidden;font-size:13px;font-weight:600;white-space:nowrap;text-overflow:ellipsis;text-align:left;transform:scaleX(0);transform-origin:left;transition:transform .6s cubic-bezier(.3,.7,.2,1),background .2s,border-color .2s}
.played .seg-t{transform:scaleX(1)}
.seg-t:hover{border-color:var(--blue)}
.seg-t[aria-selected="true"]{background:var(--grad);color:#fff;border-color:transparent}
.seg-t.study{background:transparent;border-style:dashed;cursor:default;color:var(--muted)}
.axis{position:relative;height:22px;font-size:12px;color:var(--faint);border-top:1px solid var(--line)}
.axis span{position:absolute;top:6px;transform:translateX(-50%)}
.tl-d{margin-top:14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:20px;padding:16px;border-radius:var(--r-md);background:var(--surface-2)}
.tl-d h4{font-size:17px}
.tl-d .when{color:var(--muted);font-size:13px;margin:4px 0 0}
.tl-d p{margin:0;font-size:14.5px}
.places{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.places span{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}

/* ring */
.ring-wrap{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:18px;align-items:center}
.ring{position:relative;width:100%;aspect-ratio:1}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring .track{fill:none;stroke:var(--line);stroke-width:2}
.ring .arcp{fill:none;stroke:url(#rg);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.6,0,.2,1)}
.node{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:11.5px;font-weight:600;line-height:1.1;text-align:center;padding:4px;transition:background .3s,border-color .3s,color .3s}
.node small{font-size:10.5px;color:var(--faint);font-weight:600}
.node.done{border-color:var(--violet)}
.node[aria-selected="true"]{background:var(--grad);color:#fff;border-color:transparent}
.node[aria-selected="true"] small{color:rgba(255,255,255,.8)}
.ring-c{position:absolute;inset:32%;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted)}
.ring-c b{display:block;font-family:var(--display);font-size:15px;color:var(--ink)}
.ring-d h4{font-size:16px} .ring-d .tag{font-size:12.5px;color:var(--violet);font-weight:600;margin:0 0 2px}
.ring-d p{margin:4px 0 10px;color:var(--muted);font-size:13.5px}

/* levels */
.lvls{display:grid;gap:8px}
.lv{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.lv-h{width:100%;display:grid;grid-template-columns:38px 1fr 20px;gap:12px;align-items:center;padding:10px 12px;border:0;background:transparent;text-align:left}
.lv-h:hover{background:var(--surface-2)}
.lv-n{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--display)}
.lv-h b{display:block;font-size:14.5px}
.lv-h small{display:block;font-size:12.5px;color:var(--muted);line-height:1.35}
.chev{transition:transform .25s;color:var(--faint)}
[aria-expanded="true"] .chev{transform:rotate(180deg)}
.xp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.xp > div{overflow:hidden}
.open > .xp{grid-template-rows:1fr}
.plain-list{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.plain-list li{position:relative;padding-left:17px;font-size:14px}
.plain-list li::before{content:"";position:absolute;left:2px;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--grad)}
.lv .plain-list{padding:0 14px 14px 62px}

/* donut */
.donut-wrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center}
.donut{position:relative}
.donut svg{width:100%;height:auto;display:block;transform:rotate(-90deg)}
.donut circle.sg{fill:none;stroke-width:16;transition:stroke-dashoffset .9s cubic-bezier(.3,.7,.2,1),stroke-width .2s,opacity .2s}
.donut circle.sg.dim{opacity:.3}
.donut .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .ctr b{display:block;font-family:var(--display);font-size:30px;line-height:1}
.donut .ctr span{font-size:12px;color:var(--muted)}
.dleg{display:grid;gap:6px}
.dleg button{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;border:0;background:transparent;border-radius:10px;padding:7px 8px;text-align:left;font-size:13.5px}
.dleg button:hover,.dleg button:focus-visible{background:var(--surface-2)}
.dleg i{width:12px;height:12px;border-radius:4px}
.dleg em{font-style:normal;font-weight:700;color:var(--muted)}

/* fit */
.fit-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:11px 0;align-items:center}
.fit-row + .fit-row{border-top:1px solid var(--line)}
.fit-row b{font-size:14.5px}
.fit-row p{grid-column:1/-1;margin:0;font-size:13.5px;color:var(--muted)}
.fit-close{margin-top:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--grad);color:#fff;font-size:14px;font-weight:500}

/* chat section */
.chat-h{display:flex;align-items:center;gap:12px;margin:34px 0 22px;color:var(--muted);font-size:13.5px}
.chat-h::before,.chat-h::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{margin:0 0 26px}
.msg.user{display:flex;justify-content:flex-end}
.bubble{background:var(--surface-3);padding:11px 16px;border-radius:20px 20px 6px 20px;max-width:80%;font-size:15px}
.msg.agent{display:grid;grid-template-columns:32px minmax(0,1fr);gap:14px}
.msg.agent > .orb{margin-top:2px}
.understood{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--teal);background:var(--teal-soft);padding:3px 10px;border-radius:999px;margin:2px 0 8px;font-weight:600}
.a-text{font-size:15.5px;line-height:1.62;margin:4px 0 14px;max-width:66ch}
.a-text .caret{display:inline-block;width:7px;height:1.05em;margin-left:2px;vertical-align:-2px;border-radius:2px;background:var(--grad);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.dots{display:inline-flex;gap:5px;padding:12px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:bob 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.reveal{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.a-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.a-foot .lbl{font-size:12.5px;color:var(--faint)}
.src-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.src-chip i{font-style:normal;font-weight:700;color:var(--blue)}
.follow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;text-align:left}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}

/* chat cards */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.fnode{position:relative;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-md);padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.fnode:not(:last-child)::after{content:"";position:absolute;right:-23px;top:50%;width:22px;height:2px;background:var(--line)}
.fnode .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface)}
.fnode b{font-size:14px} .fnode small{font-size:12px;color:var(--muted)}
.fnode[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.fnode[aria-pressed="true"] .ic{color:var(--blue)}
.fdetail{margin-top:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface-2);font-size:14.5px}
.pipe{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pipe span.n{padding:9px 13px;border-radius:12px;font-size:14px;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.arrow{width:18px;height:2px;background:var(--faint);position:relative;flex:none}
.arrow::after{content:"";position:absolute;right:-1px;top:-3px;border:4px solid transparent;border-left:6px solid var(--faint);border-right:0}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stp{border:0;background:transparent;padding:0 0 10px;text-align:left;display:flex;flex-direction:column;gap:7px}
.stp .bs{height:5px;border-radius:999px;background:var(--surface-3);overflow:hidden;position:relative}
.stp .bs::after{content:"";position:absolute;inset:0;background:var(--grad);transform:scaleX(0);transform-origin:left;transition:transform .45s ease}
.stp.done .bs::after,.stp[aria-selected="true"] .bs::after{transform:scaleX(1)}
.stp span{font-size:13px;color:var(--muted);font-weight:600}
.stp[aria-selected="true"] span{color:var(--ink)}
.sdetail{padding:14px;border-radius:var(--r-md);background:var(--surface-2)}
.sdetail h4{font-size:16px;margin-bottom:4px}
.sdetail > p{margin:0 0 10px;color:var(--muted);font-size:14px}
.snav{display:flex;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.toggle-row h4{font-size:15px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:42px}
.link{padding:8px 12px;border-radius:12px;font-size:14px;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chain.good .link{background:var(--teal-soft);border-color:transparent;color:var(--teal)}
.chain.bad .link{color:var(--muted);border-style:dashed}
.chain-note{font-size:13.5px;color:var(--muted);margin:10px 0 0}
.life-row{display:flex;gap:6px;flex-wrap:wrap}
.life-row span{font-size:12.5px;padding:5px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.life-row span:last-child{background:var(--violet-soft);color:var(--violet);border-color:transparent;font-weight:600}
.trow{display:grid;grid-template-columns:42px 1fr;gap:12px;padding:10px 0}
.trow + .trow{border-top:1px solid var(--line)}
.trow .ic,.grp-h .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.trow b{display:block;font-size:14.5px} .trow .meta{font-size:12.5px;color:var(--faint)}
.trow p{margin:3px 0 0;font-size:14px;color:var(--muted)}
.tlv .ti{position:relative;padding-left:22px}
.tlv{position:relative}
.tlv::before{content:"";position:absolute;left:6px;top:10px;bottom:10px;width:2px;background:var(--line)}
.tlv .ti::before{content:"";position:absolute;left:1px;top:15px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--faint)}
.tlv .ti.now::before{background:var(--blue);border-color:var(--blue)}
.tlv .ti-h{width:100%;border:0;background:transparent;text-align:left;display:grid;grid-template-columns:1fr auto 18px;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--r-sm)}
.tlv .ti-h:hover{background:var(--surface-2)}
.tlv .ti-h b{font-size:14.5px;display:block} .tlv .ti-h small{font-size:12.5px;color:var(--muted)}
.tlv .when{font-size:12.5px;color:var(--faint);white-space:nowrap}
.tlv .ti p{margin:0 10px 6px;font-size:14px}
.tlv .places{margin:0 10px 10px}
.grp{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.grp + .grp{margin-top:8px}
.grp-h{width:100%;display:grid;grid-template-columns:42px 1fr auto 20px;gap:12px;align-items:center;padding:10px 12px;border:0;background:transparent;text-align:left}
.grp-h:hover{background:var(--surface-2)}
.grp-h b{font-size:14.5px}
.grp-h .n{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-3);color:var(--muted)}
.items{padding:2px 10px 10px;display:grid;gap:6px}
.it{border-radius:12px;background:var(--surface-2);overflow:hidden}
.it-h{width:100%;border:0;background:transparent;display:grid;grid-template-columns:1fr auto 16px;gap:10px;align-items:center;padding:9px 12px;text-align:left;font-size:14px}
.it-h:hover{background:var(--surface-3)}
.it dl{margin:0;padding:0 12px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.it dt{color:var(--faint)} .it dd{margin:0}
.cert-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stack-g + .stack-g{margin-top:12px}
.stack-g b{display:block;font-size:13px;color:var(--faint);margin-bottom:6px;font-weight:600}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.cta a{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600;background:var(--surface)}
.cta a.primary{background:var(--grad);color:#fff;border-color:transparent}
.cta a:hover{border-color:var(--blue)}

/* dock */
.dock{border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px)}
.dock-in{max-width:1120px;margin:0 auto;padding:8px 24px 12px}
.tray{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.tray > div{overflow:hidden}
.tray.open{grid-template-rows:1fr}
.tray-in{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 10px}
.tray-in .tq{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 13px;font-size:14px;text-align:left;box-shadow:var(--shadow)}
.tray-in .tq:hover{border-color:var(--blue);color:var(--blue)}
.cats{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:2px 0 10px}
.msg.agent:last-child{min-height:calc(100dvh - 330px)}
.cats::-webkit-scrollbar{display:none}
.cat{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;white-space:nowrap;flex:none}
.cat:hover{border-color:var(--blue)}
.cat[aria-expanded="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cat svg{width:16px;height:16px}
.composer{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 18px;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.composer:focus-within{border-color:var(--blue)}
.composer input{flex:1;border:0;outline:0;background:transparent;font:inherit;color:var(--ink);padding:8px 0;font-size:15.5px;min-width:0}
.composer input::placeholder{color:var(--faint)}
.send{width:40px;height:40px;border-radius:50%;border:0;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none}
.send:disabled{opacity:.35;cursor:default}
.disclaimer{font-size:11.5px;color:var(--faint);text-align:center;margin:7px 0 0}

/* behind */
.behind{width:340px;border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:18px 18px 30px;display:none}
.app.show-behind .behind{display:block}
.behind h3{font-size:16px;display:flex;align-items:center;gap:8px}
.behind .intro{font-size:13.5px;color:var(--muted);margin:8px 0 14px}
.bstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.bstats div{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center}
.bstats b{display:block;font-family:var(--display);font-size:20px}
.bstats span{font-size:11.5px;color:var(--muted)}
.bsec{font-size:12.5px;font-weight:600;color:var(--faint);margin:16px 0 8px}
.bnode{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;font-size:13.5px;position:relative}
.bnode + .bnode{margin-top:18px}
.bnode + .bnode::before{content:"";position:absolute;left:22px;top:-19px;width:2px;height:18px;background:var(--line)}
.bnode .k{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--violet);margin-bottom:4px}
.bnode.trigger .k{color:var(--blue)} .bnode.src .k{color:var(--teal)} .bnode.fb .k{color:var(--amber)}
.bnode ul{margin:4px 0 0;padding-left:16px} .bnode li{margin:2px 0}
.kw{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.kw span{font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.empty-b{font-size:13.5px;color:var(--muted);padding:14px;border:1px dashed var(--line);border-radius:12px}
.srcs{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.srcs li{font-size:13px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);display:flex;gap:8px}
.srcs li i{font-style:normal;font-weight:700;color:var(--blue)}
.srcs li.lit{background:var(--teal-soft);border-color:transparent}
.close-behind{display:none}
.scrim{display:none}

@media (max-width:1180px){
  .behind{position:fixed;right:0;top:0;bottom:0;z-index:40;width:min(360px,92vw);box-shadow:var(--shadow)}
  .close-behind{display:inline-flex}
  .app.show-behind .scrim{display:block;position:fixed;inset:0;z-index:30;background:rgba(10,12,20,.35)}
}
@media (max-width:980px){
  .s4,.s5,.s6,.s7,.s8{grid-column:span 12}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:700px){
  body{font-size:14.5px}
  .bar{padding:10px 12px;gap:8px}
  .badge-g,.icon-btn .lbl{display:none}
  .wide{padding:16px 12px 6px}
  .narrow{padding:0 14px 20px}
  .dash{gap:10px}
  .tile{padding:16px}
  .kpis{grid-template-columns:1fr 1fr}
  .map-wrap,.ring-wrap,.tl-d{grid-template-columns:1fr}
  .ring{max-width:260px;margin:0 auto}
  .ctry{grid-template-columns:repeat(5,minmax(0,1fr))}
  .ctry button{flex-direction:column;gap:3px;padding:7px 2px;font-size:10.5px;font-weight:600;text-align:center}
  .ctry button .nm{display:none}
  .lane{height:auto;display:flex;flex-direction:column;gap:6px}
  .seg-t{position:static;width:auto!important;height:40px}
  .axis{display:none}
  .donut-wrap{grid-template-columns:120px minmax(0,1fr)}
  .msg.agent{grid-template-columns:1fr;gap:8px}
  .flow{grid-template-columns:1fr 1fr}
  .fnode:nth-of-type(2)::after{display:none}
  .dock-in{padding:6px 10px 8px}
  .cats{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;margin:0 -10px;padding:2px 10px 8px}
  .cats::-webkit-scrollbar{display:none}
  .lv .plain-list{padding:0 12px 12px 16px}
  .stp span{font-size:11px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- matcher ---------- */
const norm = s => ' '+s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[?!.,;:()"]/g,' ').replace(/\s+/g,' ').trim()+' ';
function score(text){
 const s=norm(text);
 return FAQ.map(f=>{let sc=0;for(const [k,w] of Object.entries(f.k)){if(s.includes(k))sc+=w;}return {id:f.id,sc};}).sort((a,b)=>b.sc-a.sc);
}
function decide(text){
 const r=score(text); const [a,b,c]=r;
 if(a.sc<1.5) return {mode:'none',r};
 if(a.sc>=2 && a.sc-b.sc>=1) return {mode:'answer',id:a.id,r};
 const opts=r.filter(x=>x.sc>=1).slice(0,3).map(x=>x.id);
 return {mode:'ask',opts,r};
}
window.__decide = t => { const d=decide(t); return {mode:d.mode,id:d.id,opts:d.opts,top:d.r.slice(0,3)}; };

 return `<svg viewBox="0 0 ${MAP.w} ${MAP.h}" role="img" aria-label="${L({pt:'Mapa dos países onde ele entregou projetos',en:'Map of the countries where he delivered projects'})}">
  <path class="land" d="${MAP.others}"/>${Object.entries(MAP.hl).map(([k,d])=>`<path class="hl" data-k="${k}" d="${d}"/>`).join('')}

 </svg>`;
}
function donutSVG(play){

 return `<svg viewBox="0 0 140 140">${CERTS.map((g,i)=>{const frac=g.items.length/CERT_TOTAL;const len=C*frac-3;const off=-acc;acc+=C*frac;

}

/* ---------- chat cards ---------- */
const CARDS = {
 none:()=> '',
 tiers:()=>`<div class="card"><div class="lvls">${TIERS.map((x,i)=>`<div class="lv${i===0?' open':''}"><button class="lv-h" aria-expanded="${i===0}"><span class="lv-n" style="background:${x.g}">${i+1}</span><span><b>${L(x.t)}</b><small>${L(x.s)}</small></span>${I('chev')}</button><div class="xp"><div><ul class="plain-list">${L(x.items).map(t=>`<li>${t}</li>`).join('')}</ul></div></div></div>`).join('')}</div></div>`,
 flow:()=>`<div class="card"><div class="flow">${FLOW.map((f,i)=>`<button class="fnode" aria-pressed="${i===1}" data-i="${i}"><span class="ic">${I(f.ic)}</span><b>${L(f.t)}</b><small>${L(f.s)}</small></button>`).join('')}</div><div class="fdetail" aria-live="polite">${L(FLOW[1].d)}</div></div>`,
 pipe:()=>`<div class="card"><div class="pipe">${['Microsoft Forms','Power Automate','UiPath','GitHub API / Actions'].map((x,i,a)=>`<span class="n">${x}</span>${i<a.length-1?'<span class="arrow"></span>':''}`).join('')}</div><p class="small muted" style="margin:12px 0 0">${L({pt:'Intake de demandas com score de viabilidade, SLA e quadros de triagem e prioridade.',en:'Demand intake with viability scoring, SLA tracking and triage and priority boards.'})}</p></div>`,
 steps:()=>`<div class="card"><div class="steps" role="tablist">${STEPS.map((s,i)=>`<button class="stp" role="tab" data-i="${i}" aria-selected="${i===0}"><span class="bs"></span><span>${L(s.t)}</span></button>`).join('')}</div><div class="sdetail" aria-live="polite"></div></div>`,
 chain:()=>`<div class="card"><div class="toggle-row"><h4>${L({pt:'Como o status é atualizado',en:'How status gets updated'})}</h4><div class="seg" role="group"><button data-mode="bad" aria-pressed="false">${L(UI.common)}</button><button data-mode="good" aria-pressed="true">${L(UI.mine)}</button></div></div><div class="chain good" aria-live="polite"></div><p class="chain-note"></p></div>`,
 life:()=>`<div class="card"><div class="life-row">${L(LIFE).map(x=>`<span>${x}</span>`).join('')}</div><p class="small muted" style="margin:12px 0 0">${L({pt:'Tracker executivo com uma linha por automação, gates, progresso, horas economizadas por ano e bloqueios.',en:'An executive tracker with one line per automation, gates, progress, hours saved per year and blockers.'})}</p></div>`,
 training:()=>{const rows=[
   {ic:'globe',tone:'amber',t:{pt:'Treinamento presencial na Alemanha',en:'On-site training in Germany'},m:'Dortmund, Bad Kreuznach, 2024',d:{pt:'Implantação de software e treinamento de usuários no local.',en:'Software implementation and user training on site.'}},
   {ic:'headset',tone:'blue',t:{pt:'Suporte global a usuários',en:'Global user support'},m:'KHS, 2023–2025',d:{pt:'Suporte técnico, implantação e otimização de licenças de plataformas de engenharia.',en:'Technical support, deployment and license optimization for engineering platforms.'}},
   {ic:'spark',tone:'violet',t:{pt:'Orientação em Copilot e IA, hoje',en:'Copilot and AI guidance, today'},m:{pt:'KHS, 2025–hoje',en:'KHS, 2025–now'},d:{pt:'Apoio a Finanças, Controladoria, Compras e colegas no uso estruturado do Copilot.',en:'Supporting Finance, Controlling, Purchasing and colleagues in structured Copilot use.'}}];
  return `<div class="card">${rows.map(r=>`<div class="trow">${icBox(r.ic,r.tone)}<div><b>${L(r.t)}</b><span class="meta">${L(r.m)}</span><p>${L(r.d)}</p></div></div>`).join('')}</div>`;},
 career:()=>`<div class="card"><div class="tlv">${[...ROLES].reverse().map((r,i)=>`<div class="ti${r.now?' now':''}${i===0?' open':''}"><button class="ti-h" aria-expanded="${i===0}"><span><b>${L(r.t)}</b><small>${L(r.o)}</small></span><span class="when">${L(r.w)}</span>${I('chev')}</button><div class="xp"><div><p>${L(r.d)}</p><div class="places">${L(r.p).map(x=>`<span>${x}</span>`).join('')}</div></div></div></div>`).join('')}</div></div>`,
 countries:()=>`<div class="card">${COUNTRIES.map(c=>`<div class="trow">${icBox('globe','violet')}<div><b>${L(c.n)}</b><p>${L(c.d)}</p></div></div>`).join('')}</div>`,
 langs:()=>`<div class="card"><div class="langs">${LANGS.map(x=>`<div class="lg-row"><b>${L(x.n)}</b><span>${L(x.l)}</span><div class="lg-bar">${[1,2,3,4,5].map(i=>`<i class="${i<=x.v?'f':''}"></i>`).join('')}</div></div>`).join('')}</div></div>`,
 stack:()=>{const G=[{t:{pt:'Microsoft 365 e IA',en:'Microsoft 365 and AI'},c:'p-violet',x:['Microsoft 365 Copilot','Copilot Studio','Power Automate','Microsoft Forms','SharePoint / Lists','GitHub Copilot']},{t:{pt:'Automação e dados',en:'Automation and data'},c:'p-teal',x:['UiPath Studio','UiPath Orchestrator','Python','SQL','Excel / VBA']},{t:{pt:'Sistemas corporativos',en:'Enterprise systems'},c:'p-amber',x:['SAP S/4HANA','GitHub Enterprise','Microsoft Azure']}];
  return `<div class="card">${G.map(g=>`<div class="stack-g"><b>${L(g.t)}</b><div class="chips">${g.x.map(x=>`<span class="pill ${g.c}">${x}</span>`).join('')}</div></div>`).join('')}</div>`;},
 certs:(opt)=>{const open=opt&&opt.open!==undefined?opt.open:0;
  return `<div class="card"><div class="cert-top"><span class="small muted">${CERT_TOTAL} ${L({pt:'itens em 4 grupos',en:'items in 4 groups'})}</span><button class="chip" data-all="open">${L(UI.expandAll)}</button></div>
  ${CERTS.map((g,gi)=>`<div class="grp${gi===open?' open':''}"><button class="grp-h" aria-expanded="${gi===open}">${icBox(g.ic,g.tone)}<b>${L(g.g)}</b><span class="n">${g.items.length}</span>${I('chev')}</button>
   <div class="xp"><div><div class="items">${g.items.map(it=>`<div class="it"><button class="it-h" aria-expanded="false"><span>${it.n}</span><span class="pill ${TYPES[it.ty].c}">${L(TYPES[it.ty].t)}</span>${I('chev','width:15px;height:15px')}</button>
    <div class="xp"><div><dl><dt>${L(UI.type)}</dt><dd>${L(TYPES[it.ty].t)}</dd>${it.p?`<dt>${L(UI.provider)}</dt><dd>${it.p}</dd>`:''}${it.a?`<dt>${L(UI.applied)}</dt><dd>${L(it.a)}</dd>`:''}</dl></div></div></div>`).join('')}</div></div></div></div>`).join('')}</div>`;},
 fit:()=>`<div class="card">${FIT.map(f=>`<div class="fit-row"><b>${L(f.r)}</b><span class="pill ${f.c}">${L(f.tag)}</span><p>${L(f.d)}</p></div>`).join('')}<div class="fit-close">${L({pt:'Mais do que um desenvolvedor de Copilot Studio: negócio, processos, governança e adoção, que é o que faz o Copilot ser usado de verdade.',en:'More than a Copilot Studio developer: business, process, governance and adoption, which is what makes Copilot actually get used.'})}</div></div>`,
 contact:()=>`<div class="card"><div class="cta"><a class="primary" href="mailto:bruno.q.d.ferreira47@gmail.com">${I('mail')}${L({pt:'Enviar e-mail',en:'Send email'})}</a><a href="https://www.linkedin.com/in/bruno-queiroz-281125125" target="_blank" rel="noopener">${I('link')}LinkedIn</a><a href="https://brunoqdf47.github.io" target="_blank" rel="noopener">${I('globe')}${L({pt:'Portfólio',en:'Portfolio'})}</a></div></div>`
};
function bindCard(root){
 bindXp(root,'.lv-h'); bindXp(root,'.ti-h'); bindXp(root,'.grp-h'); bindXp(root,'.it-h');
 const all=root.querySelector('[data-all]');
 if(all) all.onclick=()=>{const o=all.dataset.all==='open';root.querySelectorAll('.grp,.it').forEach(x=>x.classList.toggle('open',o));root.querySelectorAll('.grp-h,.it-h').forEach(x=>x.setAttribute('aria-expanded',o));all.dataset.all=o?'close':'open';all.textContent=L(o?UI.collapseAll:UI.expandAll);};
 const flow=root.querySelector('.flow');
 if(flow){const det=root.querySelector('.fdetail');flow.querySelectorAll('.fnode').forEach(b=>b.onclick=()=>{flow.querySelectorAll('.fnode').forEach(x=>x.setAttribute('aria-pressed',x===b));det.textContent=L(FLOW[+b.dataset.i].d);});}
 const steps=root.querySelector('.steps');
 if(steps){const det=root.querySelector('.sdetail');const show=i=>{steps.querySelectorAll('.stp').forEach((b,j)=>{b.setAttribute('aria-selected',j===i);b.classList.toggle('done',j<i);});const s=STEPS[i];
   det.innerHTML=`<h4>${L(s.h)}</h4><p>${L(s.d)}</p><ul class="plain-list">${L(s.i).map(x=>`<li>${x}</li>`).join('')}</ul><div class="snav"><button class="chip" data-go="${(i+4)%5}">${L(UI.prev)}</button><button class="chip" data-go="${(i+1)%5}">${L(i===4?UI.restart:UI.next)}</button></div>`;
   det.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(+b.dataset.go));};
  steps.querySelectorAll('.stp').forEach(b=>b.onclick=()=>show(+b.dataset.i));show(0);}
 const chain=root.querySelector('.chain');
 if(chain){const note=root.querySelector('.chain-note');const C={bad:{l:{pt:['Alguém diz que avançou','Status atualizado'],en:['Someone says it progressed','Status updated']},n:{pt:'Rápido, mas o board passa a refletir opinião, não realidade.',en:'Fast, but the board ends up reflecting opinion, not reality.'}},good:{l:{pt:['Evidência','Validação','Decisão','Atualização','Conferência cruzada'],en:['Evidence','Validation','Decision','Update','Cross-check']},n:{pt:'Nada é fechado só para melhorar o board. O histórico é preservado e todas as fontes contam a mesma história.',en:'Nothing gets closed just to make the board look better. History is preserved and every source tells the same story.'}}};
  const set=m=>{root.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===m));chain.className='chain '+m;chain.innerHTML=L(C[m].l).map((x,i,a)=>`<span class="link">${x}</span>${i<a.length-1?'<span class="arrow"></span>':''}`).join('');note.textContent=L(C[m].n);};
  root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>set(b.dataset.mode));set('good');}
}

/* ---------- dock: categories + tray ---------- */
let openCat=null;
function renderDock(){
 $('#cats').innerHTML=CATS.map(c=>`<button class="cat" data-cat="${c.id}" aria-expanded="${openCat===c.id}">${I(c.ic)}${L(c.n)}</button>`).join('');
 $('#cats').querySelectorAll('.cat').forEach(b=>b.onclick=()=>{openCat=openCat===b.dataset.cat?null:b.dataset.cat;renderTray();});
 renderTray();
}
function renderTray(){
 $('#cats').querySelectorAll('.cat').forEach(b=>b.setAttribute('aria-expanded',openCat===b.dataset.cat));
 const tray=$('#tray');
 if(!openCat){tray.classList.remove('open');return;}
 $('#trayIn').innerHTML=FAQ.filter(f=>f.cat===openCat&&!f.hidden).map(f=>`<button class="tq" data-faq="${f.id}">${L(f.q)}</button>`).join('');
 $('#trayIn').querySelectorAll('[data-faq]').forEach(b=>b.onclick=()=>{openCat=null;renderTray();askFAQ(b.dataset.faq);});
 tray.classList.add('open');
}

/* ---------- thread ---------- */
let thread=[]; let busy=false;
const msgs=$('#msgs'), tEl=$('#thread');
function agentShell(){const w=document.createElement('div');w.className='msg agent';w.innerHTML=`<div class="orb" aria-hidden="true"></div><div class="a-body"></div>`;return w;}
function userEl(text){const u=document.createElement('div');u.className='msg user';u.innerHTML='<div class="bubble"></div>';u.firstChild.textContent=text;return u;}
function nextFor(f){const same=FAQ.filter(x=>x.cat===f.cat&&x.id!==f.id&&!x.hidden).slice(0,2);const other={copilot:'ag_built',agents:'ad_how',adoption:'tr_done',gov:'cop_resp',training:'car_path',career:'cert_all',certs:'role_fit',role:'cop_use'}[f.cat];return [...same.map(x=>x.id),other].filter((v,i,a)=>a.indexOf(v)===i).slice(0,3);}
function extraHTML(m){
 if(m.mode==='answer'){const f=F(m.id);
  return `${CARDS[f.card](m.opt)}<div class="a-foot"><span class="lbl">${L(UI.sources)}</span>${f.src.map(k=>`<span class="src-chip"><i>${SRC[k].n}</i>${L(SRC[k].short)}</span>`).join('')}</div><div class="follow">${nextFor(f).map(id=>`<button class="chip" data-faq="${id}">${L(F(id).q)}</button>`).join('')}</div>`;}
 if(m.mode==='ask') return `<div class="follow">${m.opts.map(id=>`<button class="chip" data-faq="${id}">${L(F(id).q)}</button>`).join('')}</div>`;
 return `<div class="follow">${['cop_use','ag_built','car_path','role_contact'].map(id=>`<button class="chip" data-faq="${id}">${L(F(id).q)}</button>`).join('')}</div>`;
}
function textFor(m){return m.mode==='answer'?L(F(m.id).a):m.mode==='ask'?L(UI.didYouMean):L(UI.fallback);}
function headFor(m){return (m.mode==='answer'&&m.typed)?`<div class="understood">${I('target','width:14px;height:14px')}${L(UI.understood)}: ${esc(L(F(m.id).q))}</div>`:'';}
function bindAnswer(el){bindCard(el);el.querySelectorAll('[data-faq]').forEach(b=>b.onclick=()=>askFAQ(b.dataset.faq));}
function renderThread(){
 msgs.innerHTML=''; $('#chatH').hidden=!thread.length; $('#chatH').textContent=L(UI.chatH);
 thread.forEach(m=>{
  if(m.role==='user'){msgs.appendChild(userEl(m.typed||L(F(m.id).q)));return;}
  const a=agentShell(),b=a.querySelector('.a-body');b.innerHTML=`${headFor(m)}<p class="a-text">${textFor(m)}</p>${extraHTML(m)}`;bindAnswer(b);msgs.appendChild(a);});
 renderBehind();
}
function post(user, m){
 if(busy) return; busy=true; updateSend();
 thread.push(user); thread.push(m);
 $('#chatH').hidden=false; $('#chatH').textContent=L(UI.chatH);
 const u=userEl(user.typed||L(F(user.id).q)); msgs.appendChild(u);
 tEl.scrollTo({top:Math.max(0,u.offsetTop-70),behavior:reduce?'auto':'smooth'});
 const a=agentShell(),body=a.querySelector('.a-body');msgs.appendChild(a);
 const text=textFor(m);
 const finish=()=>{body.innerHTML=`${headFor(m)}<p class="a-text">${text}</p>`;const ex=document.createElement('div');ex.innerHTML=extraHTML(m);if(!reduce)ex.className='reveal';body.appendChild(ex);bindAnswer(body);busy=false;updateSend();renderBehind();};
 if(reduce){finish();return;}
 body.innerHTML=`<div class="dots"><i></i><i></i><i></i></div>`;
 setTimeout(()=>{body.innerHTML=`${headFor(m)}<p class="a-text"><span></span><span class="caret"></span></p>`;const sp=body.querySelector('.a-text span');const w=text.split(' ');let n=0;
  const iv=setInterval(()=>{n+=2;sp.textContent=w.slice(0,n).join(' ');if(n>=w.length){clearInterval(iv);finish();}},36);},480);
}
function askFAQ(id,opt){ post({role:'user',id},{role:'agent',mode:'answer',id,opt:opt||(F(id).open!==undefined?{open:F(id).open}:undefined),via:'click'}); }
function askText(text){
 text=text.trim(); if(!text) return;
 const d=decide(text);
 const m={role:'agent',mode:d.mode,via:'typed',typed:text,top:d.r.slice(0,3)};
 if(d.mode==='answer'){m.id=d.id;const f=F(d.id);if(f.open!==undefined)m.opt={open:f.open};}
 if(d.mode==='ask') m.opts=d.opts;
 post({role:'user',typed:text},m);
}

/* ---------- behind ---------- */
function renderBehind(){
 const last=[...thread].reverse().find(m=>m.role==='agent');
 let flow;
 if(!last) flow=`<div class="empty-b">${L(UI.bEmpty)}</div>`;
 else{
  const trig=last.via==='typed'?`${L(UI.bTyped)}: “${esc(last.typed)}”`:`${L(UI.bClicked)}: <b>${esc(L(F(last.id).q))}</b>`;
  const conf=last.via!=='typed'?L(UI.bClick):last.mode==='answer'?L(UI.bHigh):last.mode==='ask'?L(UI.bMid):L(UI.bNone);
  const scores=last.top?`<ul>${last.top.filter(x=>x.sc>0).map(x=>`<li>${esc(L(F(x.id).q))} <span class="muted">(${x.sc.toFixed(1)})</span></li>`).join('')||`<li class="muted">—</li>`}</ul>`:'';
  flow=`<div class="bnode trigger"><div class="k">${I('flash','width:14px;height:14px')}${L(UI.bTrigger)}</div>${trig}</div>
   <div class="bnode ${last.mode==='none'?'fb':''}"><div class="k">${I('target','width:14px;height:14px')}${L(UI.bMatch)}</div>${conf}${scores}</div>`;
  if(last.mode==='answer'){const f=F(last.id);
   flow+=`<div class="bnode"><div class="k">${I('doc','width:14px;height:14px')}${L(UI.bMessage)}</div>${esc(L(f.q))}<div class="small muted" style="margin-top:6px">${L(UI.bTerms)}</div><div class="kw">${Object.keys(f.k).slice(0,8).map(k=>`<span>${esc(k.trim())}</span>`).join('')}</div></div>
    <div class="bnode src"><div class="k">${I('db','width:14px;height:14px')}${L(UI.bKnow)}</div><ul>${f.src.map(k=>`<li>[${SRC[k].n}] ${L(SRC[k].long)}</li>`).join('')}</ul></div>`;}
 }
 const lit=last&&last.mode==='answer'?F(last.id).src:[];
 $('#behind').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3>${I('eye')}${L(UI.behind)}</h3><button class="icon-btn close-behind" id="closeBehind">${L(UI.close)}</button></div>
  <p class="intro">${L(UI.bIntro)}</p>
  <div class="bstats"><div><b>${FAQ.length}</b><span>${L(UI.bQ)}</span></div><div><b>${Object.keys(SRC).length}</b><span>${L(UI.bS)}</span></div><div><b>1</b><span>${L(UI.bF)}</span></div></div>
  <div class="bsec">${L(UI.bLast)}</div>${flow}
  <div class="bsec">${L(UI.bAll)}</div><ul class="srcs">${Object.entries(SRC).map(([k,s])=>`<li class="${lit.includes(k)?'lit':''}"><i>${s.n}</i>${L(s.long)}</li>`).join('')}</ul>
  <p class="small muted" style="margin-top:14px">${L(UI.bNote)}</p>`;
 const cb=$('#closeBehind'); if(cb) cb.onclick=()=>toggleBehind(false);
}

/* ---------- chrome ---------- */
function toggleBehind(force){const on=force!==undefined?force:!app.classList.contains('show-behind');app.classList.toggle('show-behind',on);$('#behindBtn').setAttribute('aria-pressed',on);}
$('#behindBtn').onclick=()=>toggleBehind();
$('#scrim').onclick=()=>toggleBehind(false);
$('#homeBtn').onclick=()=>tEl.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
const q=$('#q'),sendBtn=$('#sendBtn');
function updateSend(){sendBtn.disabled=busy||!q.value.trim();}
q.addEventListener('input',updateSend);
q.addEventListener('focus',()=>{if(openCat){openCat=null;renderTray();}});
$('#composer').addEventListener('submit',e=>{e.preventDefault();if(busy)return;const v=q.value;q.value='';updateSend();askText(v);});
function applyUI(){document.documentElement.lang=lang==='pt'?'pt-BR':'en';document.querySelectorAll('[data-t]').forEach(el=>el.textContent=L(UI[el.dataset.t]));q.placeholder=L(UI.placeholder);document.querySelectorAll('[data-setlang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.setlang===lang));}
function setLang(l,play){lang=l;try{localStorage.setItem('bq-lang',l);}catch(e){}applyUI();renderDash(play);renderDock();renderThread();}
document.querySelectorAll('[data-setlang]').forEach(b=>b.onclick=()=>{if(!busy)setLang(b.dataset.setlang,false);});

let saved=null;try{saved=localStorage.getItem('bq-lang');}catch(e){}
const gate=$('#gate');
document.querySelectorAll('.lang-btn').forEach(b=>b.onclick=()=>{gate.classList.add('hidden');setLang(b.dataset.lang,true);});
lang=saved||'pt'; applyUI(); renderDash(false); renderDock(); renderBehind();
document.querySelector(`.lang-btn[data-lang="${lang}"]`).focus();
})();
</script>
