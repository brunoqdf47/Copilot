  --font:"Segoe UI Variable Text","Segoe UI","InterEmbed",system-ui,-apple-system,sans-serif;
  --display:"Segoe UI Variable Display","Segoe UI","InterEmbed",system-ui,-apple-system,sans-serif;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14151A; --surface:#1E2028; --surface-2:#252832; --surface-3:#2D313C; --line:#343947;
    --ink:#ECEEF4; --muted:#A4AABA; --faint:#7E8495;
    --blue:#7AA2FF; --violet:#A891FF; --teal:#45CDBB; --pink:#F08AB6; --amber:#F2B451;
    --blue-soft:rgba(122,162,255,.14); --violet-soft:rgba(168,145,255,.14); --teal-soft:rgba(69,205,187,.13); --amber-soft:rgba(242,180,81,.14);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -16px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;
  background:
    radial-gradient(38% 30% at 18% 12%,rgba(47,107,255,.16),transparent 70%),
    radial-gradient(30% 26% at 88% 8%,rgba(217,87,143,.12),transparent 70%),
    radial-gradient(36% 32% at 80% 92%,rgba(17,158,145,.13),transparent 70%),
    radial-gradient(30% 30% at 30% 96%,rgba(122,92,250,.12),transparent 70%);}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3,h4{font-family:var(--display);margin:0;font-weight:600;letter-spacing:-.01em}

/* ---------- orb (brand mark) ---------- */
.orb{position:relative;flex:none;width:32px;height:32px;border-radius:42% 58% 52% 48%/48% 42% 58% 52%;
  background:conic-gradient(from 210deg,#2F6BFF,#7A5CFA,#D9578F,#FF9D5C,#19B8A6,#2F6BFF);}
.orb::after{content:"";position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.95),rgba(255,255,255,.35) 60%,transparent 70%)}
.orb.lg{width:96px;height:96px}
.orb.sm{width:26px;height:26px}

/* ---------- language gate ---------- */
.gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(243,244,248,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:opacity .45s ease,visibility .45s}
@media (prefers-color-scheme:dark){.gate{background:rgba(20,21,26,.72)}}
.gate.hidden{opacity:0;visibility:hidden}
.gate-card{text-align:center;max-width:460px;width:100%}
.gate .orb.lg{margin:0 auto 26px;animation:morph 9s ease-in-out infinite}
@keyframes morph{
  0%,100%{border-radius:42% 58% 52% 48%/48% 42% 58% 52%;transform:rotate(0)}
  50%{border-radius:56% 44% 40% 60%/42% 58% 44% 56%;transform:rotate(25deg)}
}
.gate h1{font-size:clamp(30px,6vw,40px);line-height:1.1}
.gate p{color:var(--muted);margin:10px 0 28px}
.gate-btns{display:grid;gap:12px}
.lang-btn{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);text-align:left;transition:border-color .2s,transform .2s}
.lang-btn:hover{border-color:var(--blue);transform:translateY(-1px)}
.lang-btn b{display:block;font-size:16px;font-weight:600}
.lang-btn small{color:var(--muted);font-size:13px}
.lang-code{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--surface-2);color:var(--blue)}
.gate-foot{margin-top:24px;font-size:12.5px;color:var(--faint)}

/* ---------- app shell ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:272px minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden}
.side{display:flex;flex-direction:column;gap:6px;padding:16px 12px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--surface) 70%,transparent);backdrop-filter:blur(10px);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.brand b{display:block;font-family:var(--display);font-weight:600;font-size:15px}
.brand small{display:block;color:var(--muted);font-size:12.5px}
.new-chat{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-weight:600;margin-bottom:10px}
.new-chat:hover{border-color:var(--blue)}
.side h4{font-size:12.5px;color:var(--faint);font-weight:600;padding:8px 10px 4px}
.topic-btn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);border:0;background:transparent;text-align:left;color:var(--ink);font-size:14.5px}
.topic-btn:hover{background:var(--surface-2)}
.topic-btn.active{background:var(--blue-soft);color:var(--blue);font-weight:600}
.topic-btn svg{color:var(--muted)}
.topic-btn.active svg{color:var(--blue)}
.side-foot{margin-top:auto;padding:12px 10px 4px;font-size:12px;color:var(--faint)}
.side-foot a{color:var(--muted)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden}
.bar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 55%,transparent);backdrop-filter:blur(10px)}
.bar-title{display:flex;align-items:center;gap:10px;min-width:0}
.bar-title b{font-family:var(--display);font-weight:600;white-space:nowrap}
.badge-g{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--teal-soft);color:var(--teal);font-weight:600;white-space:nowrap}
.spacer{flex:1}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface-3)}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.icon-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600}
.icon-btn:hover{border-color:var(--blue)}
.icon-btn[aria-pressed="true"]{background:var(--violet-soft);border-color:transparent;color:var(--violet)}
.menu-btn{display:none}

.thread{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth;position:relative}
.thread-in{max-width:800px;margin:0 auto;padding:28px 24px 30px}
.composer-wrap{max-width:800px;width:100%;margin:0 auto;padding:4px 24px 14px}
.composer{display:flex;align-items:flex-end;gap:10px;padding:10px 10px 10px 18px;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.composer:focus-within{border-color:var(--blue)}
.composer input{flex:1;border:0;outline:0;background:transparent;font:inherit;color:var(--ink);padding:9px 0;font-size:15.5px;min-width:0}
.composer input::placeholder{color:var(--faint)}
.send{width:40px;height:40px;border-radius:50%;border:0;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none}
.send:disabled{opacity:.35;cursor:default}
.disclaimer{font-size:12px;color:var(--faint);text-align:center;margin:8px 0 0}

/* ---------- welcome ---------- */
.welcome{padding:6vh 0 10px}
.welcome .orb{margin-bottom:22px}
.welcome h2{font-size:clamp(28px,4vw,38px);line-height:1.12;max-width:20ch}
.welcome h2 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome p{color:var(--muted);font-size:16.5px;max-width:58ch;margin:12px 0 26px}
.starters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.starter{display:flex;flex-direction:column;gap:12px;align-items:flex-start;text-align:left;padding:16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);transition:border-color .2s,transform .2s}
.starter:hover{border-color:var(--blue);transform:translateY(-2px)}
.starter .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.starter b{font-weight:600;font-size:15px}
.starter small{color:var(--muted);font-size:13.5px;line-height:1.4}

/* ---------- messages ---------- */
.msg{margin:0 0 26px}
.msg.user{display:flex;justify-content:flex-end}
.bubble{background:var(--surface-3);padding:11px 16px;border-radius:20px 20px 6px 20px;max-width:80%;font-size:15px}
.msg.agent{display:grid;grid-template-columns:32px minmax(0,1fr);gap:14px}
.msg.agent .orb{margin-top:2px}
.a-text{font-size:15.5px;line-height:1.62;margin:4px 0 14px;max-width:66ch}
.a-text .caret{display:inline-block;width:7px;height:1.05em;margin-left:2px;vertical-align:-2px;border-radius:2px;background:var(--grad);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.dots{display:inline-flex;gap:5px;padding:12px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:bob 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.reveal{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.a-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.a-foot .lbl{font-size:12.5px;color:var(--faint);margin-right:2px}
.src-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.src-chip i{font-style:normal;font-weight:700;color:var(--blue)}
.follow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;text-align:left}
.chip:hover{border-color:var(--blue);color:var(--blue)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-h h3{font-size:17px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.pill{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p-blue{background:var(--blue-soft);color:var(--blue)} .p-violet{background:var(--violet-soft);color:var(--violet)}
.p-teal{background:var(--teal-soft);color:var(--teal)} .p-amber{background:var(--amber-soft);color:var(--amber)}
.plain-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plain-list li{position:relative;padding-left:18px;font-size:14.5px}
.plain-list li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--grad)}

/* profile */
.prof{display:flex;gap:16px;align-items:center}
.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px;color:#fff;background:var(--grad);flex:none}
.prof h3{font-size:20px}
.prof p{margin:2px 0 0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0}
.stat{background:var(--surface-2);border-radius:var(--r-md);padding:12px}
.stat b{display:block;font-family:var(--display);font-size:22px;font-weight:700}
.stat span{font-size:12.5px;color:var(--muted);line-height:1.35;display:block}
.posline{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.posline .plus{color:var(--faint);font-weight:600}
.impact{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.impact div{border:1px dashed var(--line);border-radius:var(--r-md);padding:12px}
.impact b{font-family:var(--display);font-size:17px;display:block}

/* tiers */
.tier{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.tier + .tier{margin-top:10px}
.tier-h{width:100%;display:grid;grid-template-columns:44px 1fr 22px;gap:12px;align-items:center;padding:14px;border:0;background:transparent;text-align:left}
.tier-h:hover{background:var(--surface-2)}
.lvl{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff}
.tier-h b{display:block;font-size:15.5px}
.tier-h small{display:block;color:var(--muted);font-size:13.5px;line-height:1.4}
.chev{transition:transform .25s;color:var(--faint)}
[aria-expanded="true"] > .chev,[aria-expanded="true"] .chev{transform:rotate(180deg)}
.tier-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.tier-b > div{overflow:hidden}
.tier.open .tier-b{grid-template-rows:1fr}
.tier-b .plain-list{padding:0 16px 16px 72px}
.quote{margin-top:14px;padding:14px 16px;border-radius:var(--r-md);background:var(--violet-soft);font-size:15px}
.quote b{color:var(--violet)}

/* agent flow */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;position:relative}
.fnode{position:relative;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-md);padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:border-color .2s,background .2s}
.fnode:not(:last-child)::after{content:"";position:absolute;right:-23px;top:50%;width:22px;height:2px;background:var(--line)}
.fnode .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface)}
.fnode b{font-size:14px}
.fnode small{font-size:12px;color:var(--muted)}
.fnode[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.fnode[aria-pressed="true"] .ic{color:var(--blue)}
.pulse{position:absolute;top:calc(50% - 4px);width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--blue-soft);left:0;opacity:0}
.flow.run .pulse{animation:travel 2.4s cubic-bezier(.5,0,.5,1) .3s 1 both}
@keyframes travel{0%{left:2%;opacity:0}8%{opacity:1}92%{opacity:1}100%{left:97%;opacity:0}}
.fdetail{margin-top:14px;padding:14px 16px;border-radius:var(--r-md);background:var(--surface-2);font-size:14.5px;min-height:52px}
.note{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:13.5px;color:var(--muted)}
.note svg{color:var(--violet);margin-top:2px}

/* stepper */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;position:relative}
.stp{border:0;background:transparent;padding:0 0 10px;text-align:left;display:flex;flex-direction:column;gap:8px}
.stp .bar-s{height:5px;border-radius:999px;background:var(--surface-3);overflow:hidden;position:relative}
.stp .bar-s::after{content:"";position:absolute;inset:0;background:var(--grad);transform:scaleX(0);transform-origin:left;transition:transform .45s ease}
.stp.done .bar-s::after,.stp[aria-selected="true"] .bar-s::after{transform:scaleX(1)}
.stp span{font-size:13px;color:var(--muted);font-weight:600}
.stp[aria-selected="true"] span{color:var(--ink)}
.stp em{font-style:normal;font-size:11.5px;color:var(--faint)}
.sdetail{padding:16px;border-radius:var(--r-md);background:var(--surface-2);margin-top:6px}
.sdetail h4{font-size:17px;margin-bottom:4px}
.sdetail > p{margin:0 0 12px;color:var(--muted);font-size:14.5px}
.snav{display:flex;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.methods{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px}

/* governance compare */
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:44px}
.link{padding:9px 13px;border-radius:12px;font-size:14px;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chain.good .link{background:var(--teal-soft);border-color:transparent;color:var(--teal)}
.chain.bad .link{color:var(--muted);border-style:dashed}
.arrow{width:18px;height:2px;background:var(--line);position:relative}
.arrow::after{content:"";position:absolute;right:-1px;top:-3px;border:4px solid transparent;border-left:6px solid var(--line);border-right:0}
.chain-note{font-size:13.5px;color:var(--muted);margin:10px 0 0}
.life{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.life-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.life-row span{font-size:12.5px;padding:5px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.life-row span:last-child{background:var(--violet-soft);color:var(--violet);border-color:transparent;font-weight:600}

/* training */
.trow{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:12px 0}
.trow + .trow{border-top:1px solid var(--line)}
.trow .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.trow b{display:block;font-size:15px}
.trow .meta{font-size:12.5px;color:var(--faint)}
.trow p{margin:4px 0 0;font-size:14.5px;color:var(--muted)}

/* career */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
.ti{position:relative}
.ti::before{content:"";position:absolute;left:-21px;top:17px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--faint)}
.ti.now::before{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.ti-h{width:100%;border:0;background:transparent;text-align:left;display:grid;grid-template-columns:1fr auto 18px;gap:10px;align-items:center;padding:10px 10px;border-radius:var(--r-sm)}
.ti-h:hover{background:var(--surface-2)}
.ti-h b{font-size:15px;display:block}
.ti-h small{font-size:13px;color:var(--muted)}
.ti-h .when{font-size:12.5px;color:var(--faint);white-space:nowrap}
.ti-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.ti-b > div{overflow:hidden}
.ti.open .ti-b{grid-template-rows:1fr}
.ti-b p{margin:0 10px 8px;font-size:14.5px}
.places{display:flex;flex-wrap:wrap;gap:6px;margin:0 10px 12px}
.places span{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.edu{margin-top:10px;padding:12px 14px;border-radius:var(--r-md);border:1px dashed var(--line);font-size:14px}

/* certificates */
.cert-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cert-top .count{font-family:var(--display);font-size:28px;font-weight:700;line-height:1}
.cert-top .count small{font-family:var(--font);font-size:13px;font-weight:400;color:var(--muted);margin-left:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.grp{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.grp + .grp{margin-top:10px}
.grp-h{width:100%;display:grid;grid-template-columns:40px 1fr auto 20px;gap:12px;align-items:center;padding:12px 14px;border:0;background:transparent;text-align:left}
.grp-h:hover{background:var(--surface-2)}
.grp-h .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center}
.grp-h b{font-size:15px}
.grp-h .n{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-3);color:var(--muted)}
.grp-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s ease}
.grp-b > div{overflow:hidden}
.grp.open .grp-b{grid-template-rows:1fr}
.items{padding:2px 12px 12px 12px;display:grid;gap:6px}
.it{border-radius:12px;background:var(--surface-2);overflow:hidden}
.it-h{width:100%;border:0;background:transparent;display:grid;grid-template-columns:1fr auto 16px;gap:10px;align-items:center;padding:10px 12px;text-align:left;font-size:14.5px}
.it-h:hover{background:var(--surface-3)}
.it-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.it-b > div{overflow:hidden}
.it.open .it-b{grid-template-rows:1fr}
.it-b dl{margin:0;padding:0 12px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.it-b dt{color:var(--faint)}
.it-b dd{margin:0}

/* fit */
.fit-row{display:grid;grid-template-columns:minmax(150px,1fr) auto;gap:6px 14px;padding:14px 0;align-items:center}
.fit-row + .fit-row{border-top:1px solid var(--line)}
.fit-row b{font-size:15px}
.fit-row p{grid-column:1 / -1;margin:0;font-size:14px;color:var(--muted)}
.fit-close{margin-top:14px;padding:14px 16px;border-radius:var(--r-md);background:var(--grad);color:#fff;font-size:15px;font-weight:500}

/* contact */
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.cta a{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600;background:var(--surface)}
.cta a.primary{background:var(--grad);color:#fff;border-color:transparent}
.cta a:hover{border-color:var(--blue)}

/* ---------- behind panel ---------- */
.behind{width:340px;border-left:1px solid var(--line);background:color-mix(in srgb,var(--surface) 78%,transparent);backdrop-filter:blur(10px);overflow-y:auto;padding:18px 18px 30px;display:none}
.app.show-behind .behind{display:block}
.behind h3{font-size:16px;display:flex;align-items:center;gap:8px}
.behind .intro{font-size:13.5px;color:var(--muted);margin:8px 0 14px}
.bstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.bstats div{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center}
.bstats b{display:block;font-family:var(--display);font-size:20px}
.bstats span{font-size:11.5px;color:var(--muted)}
.bsec{font-size:12.5px;font-weight:600;color:var(--faint);margin:16px 0 8px}
.node{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;font-size:13.5px;position:relative}
.node + .node{margin-top:18px}
.node + .node::before{content:"";position:absolute;left:22px;top:-19px;width:2px;height:18px;background:var(--line)}
.node .k{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--violet);margin-bottom:4px}
.node.trigger .k{color:var(--blue)} .node.src .k{color:var(--teal)} .node.fb .k{color:var(--amber)}
.node ul{margin:4px 0 0;padding-left:16px}
.node li{margin:2px 0}
.empty-b{font-size:13.5px;color:var(--muted);padding:14px;border:1px dashed var(--line);border-radius:12px}
.srcs{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.srcs li{font-size:13px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);display:flex;gap:8px;transition:background .3s,border-color .3s}
.srcs li i{font-style:normal;font-weight:700;color:var(--blue)}
.srcs li.lit{background:var(--teal-soft);border-color:transparent}
.close-behind{display:none}

.scrim{display:none}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .app{grid-template-columns:240px minmax(0,1fr) auto}
  .behind{position:fixed;right:0;top:0;bottom:0;z-index:30;box-shadow:var(--shadow);background:var(--surface)}
  .close-behind{display:inline-flex}
  .app.show-behind .scrim{display:block}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:30;transform:translateX(-100%);transition:transform .3s ease;background:var(--surface)}
  .app.show-side .side{transform:none}
  .app.show-side .scrim{display:block}
  .menu-btn{display:inline-flex}
  .scrim{position:fixed;inset:0;z-index:20;background:rgba(10,12,20,.35)}
  .behind{width:min(360px,92vw)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flow{grid-template-columns:1fr 1fr}
  .fnode:nth-of-type(2)::after{display:none}
  .pulse{display:none}
}
@media (max-width:600px){
  body{font-size:14.5px}
  .bar{padding:10px 12px;gap:8px}
  .badge-g,.icon-btn .lbl{display:none}
  .thread-in{padding:20px 16px 20px}
  .composer-wrap{padding:4px 12px 10px}
  .starters{grid-template-columns:1fr;gap:8px}
  .starter{flex-direction:row;align-items:center;padding:12px}
  .starter small{display:none}
  .disclaimer{font-size:11px;line-height:1.35}
  .msg.agent{grid-template-columns:1fr;gap:8px}
  .card{padding:16px}
  .impact{grid-template-columns:1fr}
  .steps{grid-template-columns:repeat(5,minmax(0,1fr))}
  .stp em{display:none}
  .stp span{font-size:11.5px}
  .tier-b .plain-list{padding:0 14px 14px 18px}
  .welcome{padding:2vh 0 6px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

  return `<div class="card">${rows.map(r=>`<div class="trow">${icBox(r.ic,r.tone)}<div><b>${L(r.t)}</b><span class="meta">${L(r.m)}</span><p>${L(r.d)}</p></div></div>`).join('')}
   <div class="posline" style="margin-top:10px"><span class="small muted" style="margin-right:4px">${L({pt:'Idiomas:',en:'Languages:'})}</span><span class="pill p-blue">${L({pt:'Português',en:'Portuguese'})}</span><span class="pill p-violet">${L({pt:'Inglês',en:'English'})}</span><span class="pill p-teal">${L({pt:'Espanhol',en:'Spanish'})}</span><span class="pill p-amber">${L({pt:'Alemão intermediário',en:'Intermediate German'})}</span></div></div>`;
 },
 career(){
  return `<div class="card"><div class="tl">${ROLES.map((r,i)=>`
   <div class="ti${r.now?' now':''}${i===0?' open':''}"><button class="ti-h" aria-expanded="${i===0}"><span><b>${L(r.t)}</b><small>${L(r.o)}</small></span><span class="when">${L(r.w)}</span>${I('chev')}</button>
   <div class="ti-b"><div><p>${L(r.d)}</p><div class="places">${L(r.p).map(x=>`<span>${x}</span>`).join('')}</div></div></div></div>`).join('')}</div>
   <div class="edu"><b>${L({pt:'Bacharelado em Sistemas de Informação',en:"Bachelor's in Information Systems"})}</b><span class="muted">, Universidade Presbiteriana Mackenzie, 2008–2012</span></div></div>`;
 },
 certs(){
  const total=CERTS.reduce((a,g)=>a+g.items.length,0);
  return `<div class="card"><div class="cert-top"><div class="count">${total}<small>${L(UI.items)}</small></div><button class="chip" data-all="open">${L(UI.expandAll)}</button></div>
   <div class="legend">${Object.values(TYPES).map(x=>`<span class="pill ${x.c}">${L(x.t)}</span>`).join('')}</div>
   ${CERTS.map((g,gi)=>`<div class="grp${gi===0?' open':''}"><button class="grp-h" aria-expanded="${gi===0}">${icBox(g.ic,g.tone)}<b>${L(g.g)}</b><span class="n">${g.items.length}</span>${I('chev')}</button>
    <div class="grp-b"><div><div class="items">${g.items.map(it=>`
     <div class="it"><button class="it-h" aria-expanded="false"><span>${it.n}</span><span class="pill ${TYPES[it.ty].c}">${L(TYPES[it.ty].t)}</span>${I('chev','width:15px;height:15px')}</button>
      <div class="it-b"><div><dl><dt>${L(UI.type)}</dt><dd>${L(TYPES[it.ty].t)}</dd>${it.p?`<dt>${L(UI.provider)}</dt><dd>${it.p}</dd>`:''}${it.a?`<dt>${L(UI.applied)}</dt><dd>${L(it.a)}</dd>`:''}</dl></div></div></div>`).join('')}</div></div></div></div>`).join('')}</div>`;
 },
 fit(){
  return `<div class="card">${FIT.map(f=>`<div class="fit-row"><b>${L(f.r)}</b><span class="pill ${f.c}">${L(f.tag)}</span><p>${L(f.d)}</p></div>`).join('')}
   <div class="fit-close">${L({pt:'Mais do que um desenvolvedor de Copilot Studio: negócio, processos, governança e adoção, que é o que faz o Copilot ser usado de verdade.',en:'More than a Copilot Studio developer: business, process, governance and adoption, which is what makes Copilot actually get used.'})}</div></div>`;
 },
 contact(){
  return `<div class="card"><div class="cta">
   <a class="primary" href="mailto:bruno.q.d.ferreira47@gmail.com">${I('mail')}${L({pt:'Enviar e-mail',en:'Send email'})}</a>
   <a href="https://www.linkedin.com/in/bruno-queiroz-281125125" target="_blank" rel="noopener">${I('link')}LinkedIn</a>
   <a href="https://brunoqdf47.github.io" target="_blank" rel="noopener">${I('globe')}${L({pt:'Portfólio',en:'Portfolio'})}</a></div>
   <p class="small muted" style="margin:14px 0 0">bruno.q.d.ferreira47@gmail.com</p></div>`;
 }
};

/* ---------- card behaviours ---------- */
function bindCard(root, id){
 root.querySelectorAll('.tier-h').forEach(b=>b.onclick=()=>{const t=b.parentElement;const o=!t.classList.contains('open');t.classList.toggle('open',o);b.setAttribute('aria-expanded',o);});
 root.querySelectorAll('.ti-h').forEach(b=>b.onclick=()=>{const t=b.parentElement;const o=!t.classList.contains('open');t.classList.toggle('open',o);b.setAttribute('aria-expanded',o);});
 root.querySelectorAll('.grp-h').forEach(b=>b.onclick=()=>{const t=b.parentElement;const o=!t.classList.contains('open');t.classList.toggle('open',o);b.setAttribute('aria-expanded',o);});
 root.querySelectorAll('.it-h').forEach(b=>b.onclick=()=>{const t=b.parentElement;const o=!t.classList.contains('open');t.classList.toggle('open',o);b.setAttribute('aria-expanded',o);});
 const all=root.querySelector('[data-all]');
 if(all) all.onclick=()=>{const open=all.dataset.all==='open';
   root.querySelectorAll('.grp,.it').forEach(x=>x.classList.toggle('open',open));
   root.querySelectorAll('.grp-h,.it-h').forEach(x=>x.setAttribute('aria-expanded',open));
   all.dataset.all=open?'close':'open'; all.textContent=L(open?UI.collapseAll:UI.expandAll);};
 const flow=root.querySelector('.flow');
 if(flow){const det=root.querySelector('.fdetail');
   flow.querySelectorAll('.fnode').forEach(b=>b.onclick=()=>{flow.querySelectorAll('.fnode').forEach(x=>x.setAttribute('aria-pressed',x===b));det.textContent=L(FLOW[+b.dataset.i].d);});
   requestAnimationFrame(()=>flow.classList.add('run'));}
 const steps=root.querySelector('.steps');
 if(steps){const det=root.querySelector('.sdetail');
   const show=i=>{steps.querySelectorAll('.stp').forEach((b,j)=>{b.setAttribute('aria-selected',j===i);b.classList.toggle('done',j<i);});
     const s=STEPS[i];
     det.innerHTML=`<h4>${L(s.h)}</h4><p>${L(s.d)}</p><ul class="plain-list">${L(s.i).map(x=>`<li>${x}</li>`).join('')}</ul>
      <div class="snav"><button class="chip" data-go="${(i+4)%5}">${L(UI.prev)}</button><button class="chip" data-go="${(i+1)%5}">${L(i===4?UI.restart:UI.nextStep)}</button></div>`;
     det.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(+b.dataset.go));};
   steps.querySelectorAll('.stp').forEach(b=>b.onclick=()=>show(+b.dataset.i)); show(0);}
 const seg=root.querySelector('[data-mode]');
 if(seg){const chain=root.querySelector('.chain'),note=root.querySelector('.chain-note');
   const C={bad:{l:{pt:['Alguém diz que avançou','Status atualizado'],en:['Someone says it progressed','Status updated']},n:{pt:'Rápido, mas o board passa a refletir opinião, não realidade.',en:'Fast, but the board ends up reflecting opinion, not reality.'}},
            good:{l:{pt:['Evidência','Validação','Decisão','Atualização','Conferência cruzada'],en:['Evidence','Validation','Decision','Update','Cross-check']},n:{pt:'Nada é fechado só para melhorar o board. O histórico é preservado e o GitHub, a planilha e o dashboard contam a mesma história.',en:'Nothing gets closed just to make the board look better. History is preserved, and GitHub, the tracker and the dashboard tell the same story.'}}};
   const set=m=>{root.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===m));
     chain.className='chain '+m; chain.innerHTML=L(C[m].l).map((x,i,a)=>`<span class="link">${x}</span>${i<a.length-1?'<span class="arrow"></span>':''}`).join(''); note.textContent=L(C[m].n);};
   root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>set(b.dataset.mode)); set('good');}
}

/* ---------- sidebar ---------- */
function renderSide(){
 $('#topicList').innerHTML = TOPICS.map(t=>`<button class="topic-btn" data-topic="${t.id}">${I(t.icon)}<span>${L(t.label)}</span></button>`).join('');
 $('#topicList').querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{askTopic(b.dataset.topic);closeDrawers();});
 markActive();
}
function markActive(){
 const last=[...thread].reverse().find(m=>m.role==='agent');
 document.querySelectorAll('.topic-btn').forEach(b=>b.classList.toggle('active', !!last && last.topic===b.dataset.topic));
}

/* ---------- thread ---------- */
let thread = []; // {role, text?, topic?, typed?}
const tIn = $('#threadIn'), tEl = $('#thread');
let busy=false;

function welcomeHTML(){
 const starters=['copilot','agents','adoption','fit'].map(id=>{const t=T(id);return `<button class="starter" data-topic="${id}">${icBox(t.icon,t.tone)}<span><b>${L(t.prompt)}</b><br><small>${L(t.sub)}</small></span></button>`;}).join('');
 return `<div class="welcome"><div class="orb lg" aria-hidden="true" style="width:56px;height:56px"></div>
  <h2>${L(UI.hello1)}<span>${L(UI.hello2)}</span></h2><p>${L(UI.helloSub)}</p><div class="starters">${starters}</div></div>`;
}
function footHTML(topic){
 const srcs=topic.src.map(k=>`<span class="src-chip"><i>${SRC[k].n}</i>${L(SRC[k].short)}</span>`).join('');
 const nx=topic.next.map(id=>`<button class="chip" data-topic="${id}">${L(T(id).prompt)}</button>`).join('');
 return `<div class="a-foot"><span class="lbl">${L(UI.sources)}</span>${srcs}</div><div class="follow">${nx}</div>`;
}
function fallbackHTML(){
 return `<div class="follow">${['overview','copilot','agents','certs'].map(id=>`<button class="chip" data-topic="${id}">${L(T(id).prompt)}</button>`).join('')}</div>`;
}
function bindChips(el){ el.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>askTopic(b.dataset.topic)); }

function agentShell(){
 const w=document.createElement('div'); w.className='msg agent';
 w.innerHTML=`<div class="orb" aria-hidden="true"></div><div class="a-body"></div>`; return w;
}
function renderAll(){
 tIn.innerHTML='';
 if(!thread.length){ tIn.innerHTML=welcomeHTML(); bindChips(tIn); }
 thread.forEach(m=>{
  if(m.role==='user'){ const u=document.createElement('div'); u.className='msg user'; u.innerHTML=`<div class="bubble"></div>`; u.firstChild.textContent=m.typed||L(T(m.topic).prompt); tIn.appendChild(u); }
  else { const a=agentShell(), body=a.querySelector('.a-body');
   if(m.topic){ const t=T(m.topic); body.innerHTML=`<p class="a-text">${L(t.text)}</p>${CARDS[t.card]()}${footHTML(t)}`; bindCard(body,t.id); }
   else { body.innerHTML=`<p class="a-text">${L(UI.fallback)}</p>${fallbackHTML()}`; }
   bindChips(body); tIn.appendChild(a); }
 });
 markActive(); renderBehind();
}

function addUser(text){
 if(!tIn.querySelector('.msg')) tIn.innerHTML='';
 const u=document.createElement('div'); u.className='msg user'; u.innerHTML=`<div class="bubble"></div>`; u.firstChild.textContent=text; tIn.appendChild(u);
 tEl.scrollTo({top:Math.max(0,u.offsetTop-16),behavior:reduce?'auto':'smooth'}); return u;
}
function respond(topicId, typed){
 busy=true;
 const a=agentShell(), body=a.querySelector('.a-body'); tIn.appendChild(a);
 const t=topicId?T(topicId):null;
 const text=t?L(t.text):L(UI.fallback);
 const finish=()=>{
   const p=body.querySelector('.a-text'); if(p) p.textContent=text;
   const extra=document.createElement('div');
   extra.innerHTML = t ? `${CARDS[t.card]()}${footHTML(t)}` : fallbackHTML();
   if(!reduce) extra.className='reveal';
   body.appendChild(extra); if(t) bindCard(extra,t.id); bindChips(extra);
   busy=false; markActive(); renderBehind(); updateSend();
 };
 if(reduce){ body.innerHTML=`<p class="a-text"></p>`; finish(); return; }
 body.innerHTML=`<div class="dots" aria-label="…"><i></i><i></i><i></i></div>`;
 setTimeout(()=>{
   body.innerHTML=`<p class="a-text"><span></span><span class="caret"></span></p>`;
   const span=body.querySelector('.a-text span'); const words=text.split(' '); let n=0;
   const iv=setInterval(()=>{ n+=2; span.textContent=words.slice(0,n).join(' ');
     if(n>=words.length){ clearInterval(iv); finish(); } }, 38);
 }, 520);
}
function askTopic(id){
 if(busy) return;
 thread.push({role:'user',topic:id}); thread.push({role:'agent',topic:id,via:'click'});
 addUser(L(T(id).prompt)); respond(id);
}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function match(text){
 const s=' '+norm(text)+' ';
 let best=null, score=0;
 TOPICS.forEach(t=>{ let sc=0; t.keys.forEach(k=>{ if(s.includes(norm(k))) sc+=(t.w&&t.w[k])||1; }); if(sc>score){score=sc;best=t.id;} });
 return best;
}
function askText(text){
 if(busy||!text.trim()) return;
 const id=match(text);
 thread.push({role:'user',typed:text}); thread.push({role:'agent',topic:id,via:'typed',typed:text});
 addUser(text); respond(id, text);
}

/* ---------- behind the agent ---------- */
function renderBehind(){
 const last=[...thread].reverse().find(m=>m.role==='agent');
 const total=TOPICS.length;
 let flow;
 if(!last){ flow=`<div class="empty-b">${L(UI.bEmpty)}</div>`; }
 else if(!last.topic){
  flow=`<div class="node trigger"><div class="k">${I('flash','width:14px;height:14px')}${L(UI.bTrigger)}</div>${L(UI.bTyped)}: “${escapeHTML(last.typed||'')}”</div>
        <div class="node fb"><div class="k">${I('info','width:14px;height:14px')}Fallback</div>${L(UI.bFbNode)}</div>`;
 } else {
  const t=T(last.topic);
  const trig = last.via==='typed' ? `${L(UI.bTyped)}: “${escapeHTML(last.typed)}”` : `${L(UI.bClicked)}: <b>${L(t.label)}</b>`;
  flow=`<div class="node trigger"><div class="k">${I('flash','width:14px;height:14px')}${L(UI.bTrigger)}</div>${trig}
         <div class="small muted" style="margin-top:6px">${L(UI.bSamples)}:</div><ul>${L(t.samples).map(x=>`<li>“${x}”</li>`).join('')}</ul></div>
        <div class="node"><div class="k">${I('doc','width:14px;height:14px')}${L(UI.bMessage)}</div>${L({pt:'Resposta curta e revisada',en:'Short, reviewed answer'})}</div>
        <div class="node"><div class="k">${I('ms','width:14px;height:14px')}${L(UI.bCard)}</div>${L(t.cardName)}</div>
        <div class="node src"><div class="k">${I('db','width:14px;height:14px')}${L(UI.bKnow)}</div><ul>${t.src.map(k=>`<li>[${SRC[k].n}] ${L(SRC[k].long)}</li>`).join('')}</ul></div>`;
 }
 const lit = last && last.topic ? T(last.topic).src : [];
 $('#behind').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3>${I('eye')}${L(UI.behind)}</h3><button class="icon-btn close-behind" id="closeBehind">${L(UI.close)}</button></div>
  <p class="intro">${L(UI.bIntro)}</p>
  <div class="bstats"><div><b>${total}</b><span>${L(UI.bTopics)}</span></div><div><b>1</b><span>${L(UI.bFallback)}</span></div><div><b>${Object.keys(SRC).length}</b><span>${L(UI.bSources)}</span></div></div>
  <div class="bsec">${L(UI.bLast)}</div>${flow}
  <div class="bsec">${L(UI.bAll)}</div><ul class="srcs">${Object.entries(SRC).map(([k,s])=>`<li class="${lit.includes(k)?'lit':''}"><i>${s.n}</i>${L(s.long)}</li>`).join('')}</ul>
  <p class="small muted" style="margin-top:14px">${L(UI.bNote)}</p>`;
 const cb=$('#closeBehind'); if(cb) cb.onclick=()=>toggleBehind(false);
}
function escapeHTML(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- chrome ---------- */
function toggleBehind(force){
 const on = force!==undefined ? force : !app.classList.contains('show-behind');
 app.classList.toggle('show-behind',on); $('#behindBtn').setAttribute('aria-pressed',on);
}
function closeDrawers(){ app.classList.remove('show-side'); if(innerWidth<=1180) toggleBehind(false); }
$('#behindBtn').onclick=()=>toggleBehind();
$('#menuBtn').onclick=()=>app.classList.add('show-side');
$('#scrim').onclick=closeDrawers;
$('#newChat').onclick=()=>{ if(busy) return; thread=[]; renderAll(); closeDrawers(); };
const q=$('#q'), sendBtn=$('#sendBtn');
const updateSend=()=>{ sendBtn.disabled = busy || !q.value.trim(); };
q.addEventListener('input',updateSend);
$('#composer').addEventListener('submit',e=>{ e.preventDefault(); const v=q.value; q.value=''; updateSend(); askText(v); });

function setLang(l, rerender=true){
 lang=l; try{localStorage.setItem('bq-lang',l);}catch(e){}
 applyUI(); renderSide(); if(rerender) renderAll();
}
document.querySelectorAll('[data-setlang]').forEach(b=>b.onclick=()=>{ if(!busy) setLang(b.dataset.setlang); });

/* ---------- start ---------- */
let saved=null; try{saved=localStorage.getItem('bq-lang');}catch(e){}
const gate=$('#gate');
document.querySelectorAll('.lang-btn').forEach(b=>b.onclick=()=>{
 setLang(b.dataset.lang); gate.classList.add('hidden');
 if(innerWidth>1180) toggleBehind(true);
 setTimeout(()=>q.focus({preventScroll:true}),300);
});
(document.querySelector(`.lang-btn[data-lang="${saved||'pt'}"]`)).focus();
setLang(saved||'pt');
})();
</script>
